name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  mix_test:
    name: mix test (OTP ${{ matrix.otp }} | Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test on latest stable
          - elixir: '1.18.4'
            otp: '27.3'
          
          # Test on minimum supported versions
          - elixir: '1.18.4'
            otp: '26.2'
          
          # Test on next stable
          - elixir: '1.19.1'
            otp: '28.1'
          
          # Lint and check on latest
          - elixir: '1.20.4'
            otp: '29.0'
            lint: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}

    - name: Restore deps and _build cache
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

    - name: Install dependencies
      run: mix deps.get

    - name: Reject project-level advisory ignores
      if: ${{ matrix.lint }}
      run: |
        if grep -n "ignore_advisories" mix.exs; then
          echo "::error file=mix.exs::ignore_advisories is not allowed in CI; fix the dependency instead."
          exit 1
        fi

    - name: Audit dependencies for known CVEs
      if: ${{ matrix.lint }}
      run: mix hex.audit

    - name: Remove compiled application files
      run: mix clean

    - name: Compile dependencies
      if: ${{ !matrix.lint }}
      run: mix compile

    - name: Compile dependencies (lint)
      if: ${{ matrix.lint }}
      run: mix deps.compile

    - name: Compile with warnings as errors
      if: ${{ matrix.lint }}
      run: mix compile --warnings-as-errors

    - name: Check formatting
      if: ${{ matrix.lint }}
      run: mix format --check-formatted

    - name: Run Credo
      if: ${{ matrix.lint }}
      run: mix credo --strict

    - name: Run Dialyzer
      if: ${{ matrix.lint }}
      run: mix dialyzer --halt-exit-status

    - name: Run tests
      run: mix test --warnings-as-errors

  postgres_scope:
    name: postgres scope tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ectomancer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20.4'
        otp-version: '29.0'

    - name: Install dependencies
      run: mix deps.get

    - name: Run Postgres scope tests
      run: mix test --only postgres
      env:
        ECTOMANCER_PG_URL: postgres://postgres:postgres@localhost:5432/ectomancer_test

  anubis_latest:
    name: mix test (latest anubis_mcp 2.x)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20.4'
        otp-version: '29.0'

    - name: Install dependencies
      run: mix deps.get

    - name: Update anubis_mcp to the latest allowed 2.x
      run: mix deps.update anubis_mcp

    - name: Run tests
      run: mix test --warnings-as-errors
