# CodeRabbit configuration for ectomancer.
# Reference: https://docs.coderabbit.ai/reference/configuration

language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Lockfiles are regenerated by mix; they add noise without signal.
  path_filters:
    - "!mix.lock"

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  path_instructions:
    - path: "lib/**/*.ex"
      instructions: |
        Review this Elixir library with its security posture in mind:
        - `expose` must fail closed: mutating actions require authorization unless explicitly public (`authorize: :none`); flag any path that allows anonymous writes.
        - `scope:` must restrict reads and writes alike; flag writes (create/upsert/batch) that never apply the scope or do not re-check it after update.
        - Never create atoms from user input (`order_by`, filter keys, param names).
        - Client-facing errors must be generic: no `inspect/1` output, exception messages, stacktraces, or database constraint text in `error.data` or tool results; log details server-side instead.
        - Generated tool and prompt modules must export `mcp_schema/1` so anubis_mcp 2.1+ builds the input validator; arguments must never be silently dropped.
        - Optional integrations (Ecto, Phoenix, Oban, Plug) must be guarded by `Code.ensure_loaded?`; the library must compile without them.
        - Public API changes need `@doc`/`@spec` updates and a CHANGELOG.md entry.

    - path: "test/**/*.exs"
      instructions: |
        - Bug fixes require a regression test that fails before the fix and passes after.
        - Prefer asserting through public/component contracts (e.g. the anubis component registry) over private internals.
        - Tests must not require network access or external services.

    - path: ".github/workflows/*.yml"
      instructions: |
        - The CI matrix must cover the full allowed dependency range (e.g. latest allowed anubis_mcp 2.x), not just the lockfile version.

  pre_merge_checks:
    custom_checks:
      - name: "Changelog coverage"
        mode: "warning"
        instructions: |
          Every user-visible change (bug fix, feature, security hardening, dependency bump) must be documented in CHANGELOG.md in the appropriate section, and version references in mix.exs/README.md must be consistent.

chat:
  auto_reply: true
